# .streamlit/secrets.toml

[api_keys]
gemini = "AIzaSyYourGeminiKeyHere..."

[auth]
google_client_id = "YOUR_CLIENT_ID.apps.googleusercontent.com"
google_client_secret = "YOUR_CLIENT_SECRET"
redirect_uri = "http://localhost:8501" 

# ⚠️ HACKATHON NETWORKING TIP ⚠️
# If your teammates are accessing the app via your local Wi-Fi IP or Radmin VPN 
# (e.g., http://12.10.12.134:8501), Google OAuth will block them by default. 
# You MUST add their specific IP/URL to the "Authorized Redirect URIs" and 
# "Authorized JavaScript Origins" in your Google Cloud Console for it to work for them.